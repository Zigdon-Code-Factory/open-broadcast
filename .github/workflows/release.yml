name: Release

# Push a tag like v0.2.0 (must match open_broadcast.__version__) to build every platform
# and publish a GitHub Release. Tags with a suffix (v0.2.0-rc1) become pre-releases, which
# the in-app updater ignores (it only looks at /releases/latest).
#
# Run manually (workflow_dispatch) to produce downloadable build artifacts without
# publishing a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate version and release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python scripts/release_notes.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes-preview
          path: build/release-notes.md
          if-no-files-found: error

  build:
    name: build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          # Oldest supported Ubuntu runner => lowest glibc requirement for the Linux bundle.
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 libegl1 libgles2 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: |
          if ! command -v iscc >/dev/null && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: src/open_broadcast/models
          key: models-${{ hashFiles('src/open_broadcast/models.py') }}

      - name: Install
        run: pip install -e ".[dev,build]"

      - name: Test
        run: |
          python scripts/fetch_models.py
          pytest -q

      - name: Build
        run: python scripts/build.py --require-installer

      - name: Smoke-test frozen app
        run: |
          case "$RUNNER_OS" in
            Windows) exe=dist/OpenBroadcast/OpenBroadcast.exe ;;
            macOS)   exe=dist/OpenBroadcast.app/Contents/MacOS/OpenBroadcast ;;
            Linux)   exe=dist/OpenBroadcast/OpenBroadcast ;;
          esac
          status=0
          "$exe" --self-test --self-test-output selftest.txt || status=$?
          cat selftest.txt
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-binaries-*
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: release-notes-preview
          path: metadata

      - name: Checksums
        working-directory: release
        run: |
          sha256sum OpenBroadcast-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--title "Open Broadcast ${GITHUB_REF_NAME#v}" --verify-tag
                 --notes-file metadata/release-notes.md)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" release/*
